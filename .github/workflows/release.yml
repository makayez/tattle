name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail -n "{package-name}-{project-version}"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

          # CurseForge publishing is disabled: Snitch has no CurseForge project yet.
          # Once one exists, add the CF_API_KEY repository secret (a CurseForge
          # project API key) and uncomment the line below.
          # CF_API_KEY: ${{ secrets.CF_API_KEY }}
